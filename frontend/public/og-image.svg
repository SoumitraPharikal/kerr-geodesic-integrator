<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF8F5" />
  <rect x="40" y="40" width="1120" height="550" rx="4" fill="#FFFFFF" stroke="#E2DDD5" stroke-width="1.5" />

  <!-- Subtle coordinate grid lines in background -->
  <line x1="100" y1="315" x2="1100" y2="315" stroke="#F0ECE4" stroke-width="1" />
  <line x1="600" y1="80" x2="600" y2="550" stroke="#F0ECE4" stroke-width="1" />
  <circle cx="600" cy="315" r="180" fill="none" stroke="#F0ECE4" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="600" cy="315" r="90" fill="none" stroke="#F0ECE4" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Center glyph: Precessing orbit & black hole disc -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="28" fill="#18191B" />
    <ellipse cx="0" cy="0" rx="90" ry="42" fill="none" stroke="#18191B" stroke-width="2.5" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="90" ry="42" fill="none" stroke="#18191B" stroke-width="2" stroke-dasharray="4 4" transform="rotate(35)" />
    <ellipse cx="0" cy="0" rx="90" ry="42" fill="none" stroke="#C2410C" stroke-width="3" transform="rotate(95)" />
    <circle cx="75" cy="-42" r="7" fill="#C2410C" />
  </g>

  <!-- Typography -->
  <text x="600" y="420" font-family="Georgia, Cambria, serif" font-size="44" font-weight="normal" fill="#18191B" text-anchor="middle" letter-spacing="-0.5">
    Kerr Geodesics Lab
  </text>

  <text x="600" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#4B5563" text-anchor="middle">
    Numerical integration of timelike and null geodesics in Kerr and Schwarzschild spacetimes
  </text>

  <!-- Hairline separator -->
  <line x1="450" y1="500" x2="750" y2="500" stroke="#E2DDD5" stroke-width="1" />

  <!-- Provenance footer -->
  <text x="600" y="535" font-family="ui-monospace, monospace" font-size="14" fill="#6B7280" text-anchor="middle">
    v1.0.0 · Commit 062b20c · MIT License · An independent project by Soumitra Pharikal
  </text>
</svg>
