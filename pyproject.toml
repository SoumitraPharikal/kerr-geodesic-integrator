[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kerr-geodesics"
version = "1.0.0"
description = "A validated numerical framework for null geodesic integration in Schwarzschild and Kerr spacetimes."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Soumitra Pharikal", email = "24123@iiserbpr.ac.in" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
