# Render Blueprint for Kerr Geodesics Lab Backend API
# Documentation: https://render.com/docs/blueprint-spec
# Schema: https://render.com/schema/render.yaml.json

services:
  - type: web
    name: kerr-geodesics-api
    runtime: python
    plan: starter # 0.5 CPU, 512 MB RAM ($7/mo always-on; avoids free-tier cold starts)
    region: oregon
    branch: master # Explicitly links the canonical integration branch (confirmed: no 'main' branch exists)
    autoDeployTrigger: "off" # Manual deployment only; auto-deploy disabled pending explicit authorization
    buildCommand: pip install --upgrade pip && pip install ".[api]"
    startCommand: uvicorn geodesics.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Must be explicitly set in Render dashboard to match the deployed Vercel domain(s)
      - key: PYTHON_VERSION
        value: 3.13.5 # Matches the tested repository Python environment
